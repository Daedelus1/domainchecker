# Example squid.conf wiring domainchecker in as an external_acl_type
# helper, with denial reasons surfaced on the block page. See README.md's
# "Wiring into Squid" and "Surfacing denial reasons" sections for the
# full explanation. This is the actual config verified working against a
# real Squid 6.14 instance, not a hand-assembled sketch.

http_port 3128

# children-max=1 / children-startup=1: this helper binds a fixed TCP port
# (:8080) for its WebSocket listener and reads one serial stdin stream, so
# more than one running instance would collide on that port. Squid's
# external_acl_type default is children-max=5, which would try to start
# exactly that many.
#
# ttl=0 negative_ttl=0: never let Squid itself cache a verdict and skip
# asking again. This differs from the ttl=3600/negative_ttl=10 shown
# under "Wiring into Squid" in the README, which suits a human proxying
# their own casual browsing; here every request should actually reach
# the helper. domainchecker's own remembered-decision support
# (yu/nu/yd/nd, see shared/deny_messages.go) already gives the "don't
# re-prompt for things already decided" behavior one layer in, so this
# doesn't mean re-prompting a human constantly -- just that Squid always
# asks, and the answer can still come back instantly.
external_acl_type domain_checker children-max=1 children-startup=1 ttl=0 negative_ttl=0 %SRC %URI /usr/local/bin/domainchecker-server

acl ask_human external domain_checker

# ask_human also governs CONNECT (HTTPS) requests below, not just plain
# HTTP: Squid's %URI for a CONNECT is bare "host:port" with no scheme,
# which domainchecker's handleStdio (server/domainchecker/domainchecker.go)
# normalizes to a real URL before asking, so "remember this domain"
# (yd/nd) is safe to use for HTTPS targets too.

# error_directory must contain Squid's FULL stock error template set --
# Squid validates every ERR_* template exists here at startup and
# refuses to start otherwise -- plus our one addition,
# ERR_CUSTOM_ACCESS_DENIED (copy ERR_CUSTOM_ACCESS_DENIED.html, next to
# this file, in here too -- stripped of its .html extension, alongside
# the stock set, not instead of it).
#
# NEVER point this at an empty/bare directory (e.g. "."): that's a real
# mistake that was made here, and it crashes Squid immediately after
# store init with no obvious error on stdout -- the actual FATAL goes to
# cache.log, not wherever you're watching.
#
# The path below is the real one for Debian/Ubuntu's squid package
# (verified against ubuntu/squid:latest); confirm against your own
# base image/package if it's different:
#   find / -iname 'ERR_ACCESS_DENIED*' 2>/dev/null
error_directory /usr/share/squid/errors/en

# Surfaces the helper's message= (domainchecker's DenyMessage) on the
# block page instead of the stock generic "Access Denied" text.
deny_info ERR_CUSTOM_ACCESS_DENIED ask_human

http_access allow ask_human
http_access deny all
