# Example squid.conf wiring domainchecker in as an external_acl_type
# helper, with denial reasons surfaced on the block page. See README.md's
# "Wiring into Squid" and "Surfacing denial reasons" sections for the
# full explanation -- this file is just those pieces assembled into a
# runnable config, plus the minimal scaffolding (http_port, localnet)
# needed for a standalone Squid instance to actually start.

acl localnet src 0.0.0.1-0.255.255.255	# RFC 1122 "this" network (LAN)
acl localnet src 10.0.0.0/8		# RFC 1918 local private network (LAN)
acl localnet src 172.16.0.0/12		# RFC 1918 local private network (LAN)
acl localnet src 192.168.0.0/16	# RFC 1918 local private network (LAN)

acl SSL_ports port 443
acl Safe_ports port 80		# http
acl Safe_ports port 443		# https
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# --- domainchecker ---
#
# children-max=1 / children-startup=1: this helper binds a fixed TCP port
# (:8080) for its WebSocket listener and reads one serial stdin stream, so
# more than one running instance would collide on that port. Squid's
# external_acl_type default is children-max=5, which would try to start
# exactly that many.
external_acl_type domain_checker children-max=1 children-startup=1 \
    ttl=3600 negative_ttl=10 \
    %SRC %URI /path/to/domainchecker-server

acl ask_human external domain_checker

# ask_human also governs CONNECT (HTTPS) requests below, not just plain
# HTTP: Squid's %URI for a CONNECT is bare "host:port" with no scheme,
# which domainchecker's handleStdio (server/domainchecker/domainchecker.go)
# normalizes to a real URL before asking, so "remember this domain"
# (yd/nd) is safe to use for HTTPS targets too.

# error_directory must contain ERR_CUSTOM_ACCESS_DENIED -- copy
# ERR_CUSTOM_ACCESS_DENIED.html (next to this file) into it, or point
# error_directory here at this squid/ directory directly.
error_directory /path/to/squid/errors/en

# Surfaces the helper's message= (domainchecker's DenyMessage) on the
# block page instead of the stock generic "Access Denied" text.
deny_info ERR_CUSTOM_ACCESS_DENIED ask_human
# --- end domainchecker ---

http_access allow localnet ask_human
http_access deny all

http_port 3128
